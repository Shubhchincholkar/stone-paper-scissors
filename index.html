<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock,Paper & Scissor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <header>
        <div class="left-heading">
          <h2>ROCK · <span>PAPER</span> · SCISSORS</h2>
          <div class="sub">
            Best instinct wins // first to crack the streak takes the arena
          </div>
        </div>
        <div class="score">
          <div class="you">
            <span id="you-count">0</span>
            <p>YOU</p>
          </div>
          <div class="ties">
            <span id="tie-count">0</span>
            <p>TIES</p>
          </div>
          <div class="cpu">
            <span id="cpu-count">0</span>
            <p>cpu</p>
          </div>
        </div>
      </header>

      <div class="verses">
        <div class="you-circle">
          <p>YOU</p>
          <div class="you-choose">
            <span class="you-what-choose">❔</span>
          </div>
        </div>
        <div class="vs">
          <p>VS</p>
        </div>
        <div class="cpu-circle">
          <p>CPU</p>
          <div class="cpu-choose">
            <span class="cpu-what-choose">❔</span>
          </div>
        </div>
      </div>
      <div class="controls">
        <div class="choose">
          <p>choose your move</p>
        </div>
        <div class="rock" onclick="play('rock')">
          <span>🪨</span>
          <p>rock</p>
        </div>
        <div class="papper" onclick="play('paper')">
          <span>📄</span>
          <p>paper</p>
        </div>
        <div class="scissors" onclick="play('scissors')">
          <span>✂️</span>
          <p>scissors</p>
        </div>
      </div>
      <div class="footer">
        <p>
          Round : <span id="round">0</span> · Streak :
          <span id="streak">0</span>
        </p>
        <div class="round-streak"></div>
        <div class="reset">
          <button class="reset-match">reset match</button>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
